# Índice con estilo Once UI + VasakOS para el servidor de paquetes.
#
# Va dentro del `server { }` del vhost de repo.vasak.net.ar. Reemplaza al
# autoindex pelado: la carpeta se sigue listando desde el disco, pero nginx
# entrega el listado en JSON y le envuelve la cabecera y el pie que están en
# `.autoindex/`, así que el navegador recibe una página completa.
#
# Las dos piezas se copian al docroot del vhost:
#
#   cp -r autoindex /ruta/al/docroot/.autoindex
#   cp -r fonts /ruta/al/docroot/.autoindex/fonts
#
# El punto del nombre no es decoración: nginx no lista los archivos que empiezan
# con punto, así que la carpeta de los estilos no aparece en el índice de arriba.

# Los archivos del índice (CSS, JS, fuentes y las dos piezas) se sirven tal cual. El
# `^~` gana sobre la expresión regular de abajo, así que nunca se envuelven a sí
# mismos.
location ^~ /.autoindex/ {
}

# Toda carpeta termina en `/`, incluida la raíz. Los archivos no entran acá, así
# que las descargas y los rangos de los paquetes siguen como siempre.
location ~ /$ {
    autoindex on;
    autoindex_format json;

    # Las adiciones sólo se aplican a los tipos que se listan acá, y el
    # autoindex en JSON responde `application/json`, no `text/html`. Sin esta
    # línea no se agrega nada y el navegador muestra el JSON crudo.
    addition_types application/json;
    add_before_body /.autoindex/header.html;
    add_after_body /.autoindex/footer.html;

    # El autoindex en JSON responde `application/json`. El módulo `addition`
    # envuelve el cuerpo con el header/footer pero no toca la cabecera.
    # Forzamos `text/html` para que el navegador renderice como HTML en lugar
    # de mostrar el JSON crudo. `add_header` suma una segunda cabecera
    # Content-Type; los navegadores hacen *content sniffing* y eligen la
    # adecuada. Es la misma técnica que usa nginx-autoindex y funciona en
    # la práctica.
    add_header Content-Type "text/html; charset=utf-8";
}