<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<header data-header class="header-bar sticky top-0 z-40 m-2 mb-0 rounded-xl border bg-ui-bg/80 backdrop-blur-md" role="banner">
  <nav class="mx-auto flex h-[var(--header-h)] items-center justify-between px-6 lg:px-8" aria-label="Navegación principal">
    <div class="flex lg:flex-1">
      <a href="https://os.vasak.net.ar/" class="-m-1.5" aria-label="VasakOS — Inicio">
        <span class="sr-only">VasakOS</span>
        <img class="h-10 w-auto" src="https://os.vasak.net.ar/img/logo.svg" alt="" title="VasakOS" />
      </a>
    </div>
    <div class="hidden lg:flex lg:gap-x-8">
      <a href="https://os.vasak.net.ar/" class="text-[15px] font-medium leading-6 text-tx-main hover:text-brand-text">Inicio</a>
      <a href="https://os.vasak.net.ar/downloads/" class="text-[15px] font-medium leading-6 text-tx-main hover:text-brand-text">Descargas</a>
      <a href="https://os.vasak.net.ar/state/" class="text-[15px] font-medium leading-6 text-tx-main hover:text-brand-text">Estado</a>
      <a href="https://os.vasak.net.ar/changelogs/" class="text-[15px] font-medium leading-6 text-tx-main hover:text-brand-text">Cambios</a>
    </div>
    <div class="hidden lg:flex lg:flex-1 lg:items-center lg:justify-end lg:gap-3">
      <a href="https://os.vasak.net.ar/es/" class="text-sm text-tx-main hover:text-brand-text" hreflang="es">ES</a>
      <a href="https://os.vasak.net.ar/en/" class="text-sm text-tx-main hover:text-brand-text" hreflang="en">EN</a>
      <button type="button" class="btn btn-icon btn-md btn-neutral text-tx-main hover:text-brand-text" aria-label="Alternar modo oscuro" onclick="toggleDarkMode()">
        <span class="icon icon-sun" aria-hidden="true"></span>
        <span class="icon icon-moon" aria-hidden="true"></span>
      </button>
    </div>
  </nav>
</header>

<script>
(function () {
  var barra = document.querySelector("[data-header]");
  if (!barra) return;
  var pendiente = false;
  function madurar() {
    barra.classList.toggle("is-scrolled", window.scrollY > 8);
    pendiente = false;
  }
  madurar();
  addEventListener("scroll", function () {
    if (pendiente) return;
    pendiente = true;
    requestAnimationFrame(madurar);
  }, { passive: true });
})();

function toggleDarkMode() {
  var html = document.documentElement;
  var isDark = html.classList.toggle("dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
}

(function () {
  var saved = localStorage.getItem("theme");
  var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  var isDark = saved ? saved === "dark" : prefersDark;
  if (isDark) document.documentElement.classList.add("dark");
})();
</script>

<main id="main-content" class="main-content" role="main">
  <div class="page-header mx-2 mt-3">
    <div class="panel mx-auto w-full max-w-6xl rounded-xl px-6 py-8 md:px-10">
      <div class="flex flex-col items-center text-center">
        <h1 class="page-title text-2xl md:text-3xl font-bold text-brand-text mb-2">Repositorio</h1>
        <p class="page-lead text-tx-muted max-w-2xl">
          Paquetes de VasakOS para <code>pacman</code>. Agrega el repositorio siguiendo
          <a href="https://os.vasak.net.ar/downloads/" class="link-row px-3 py-1 text-sm text-tx-muted hover:text-tx-main">la guía de descargas</a>
          y luego instala con <code>sudo pacman -S <paquete></code>.
        </p>
      </div>
    </div>
  </div>

  <div class="toolbar mx-2 mt-3" role="search" aria-label="Filtrar paquetes">
    <div class="panel mx-auto w-full max-w-6xl rounded-xl px-6 py-4 md:px-10">
      <div class="flex flex-wrap items-center justify-between gap-3 lg:gap-4">
        <div class="search-field flex-1 min-w-[20rem] max-w-[32rem]">
          <label class="sr-only" for="filter-input">Filtrar por nombre, versión, descripción o arquitectura</label>
          <span class="search-icon" aria-hidden="true"><i class="icon icon-search"></i></span>
          <input id="filter-input" type="search" placeholder="Filtrar paquetes…" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <button type="button" class="clear-btn" aria-label="Limpiar filtro" hidden><i class="icon icon-xmark"></i></button>
        </label>
        </div>
        <div class="toolbar-meta" id="toolbar-meta" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <section id="listing" class="mx-2 mt-3" aria-label="Contenido de la carpeta">
    <div class="panel mx-auto w-full max-w-6xl rounded-xl md:px-10">
      <noscript>
        <div class="noscript-notice p-6 text-center">
          <i class="icon icon-triangle-exclamation empty-mark mx-auto mb-4" aria-hidden="true"></i>
          <p class="text-tx-muted mb-2">El listado interactivo requiere JavaScript.</p>
          <p class="text-sm text-tx-muted">Los archivos están disponibles inspeccionando el código de la página (el JSON con la lista está en el bloque <code><script type="application/json"></code>).</p>
        </div>
      </noscript>
      <!-- JSON data loaded dynamically via fetch -->
    </div>
  </section>
</main>
